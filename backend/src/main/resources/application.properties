spring.application.name=consultar-seguimiento-bolsines
# El mock del GPS Tracker de la catedra (dsi-api-bolsines) usa el 8080,
# por eso este backend levanta en el 8081.
server.port=8081

# ---------- Persistencia (JPA + H2) ----------
spring.datasource.url=jdbc:h2:mem:bolsinesdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.jpa.defer-datasource-initialization=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------- GPS Tracker (patron Adapter) ----------
# Modelo de GPS Tracker que usa el sistema. Valores posibles:
#   XTR-4500L | NAVTRACK-QX-7A | GEOPULSE-MTR-900
# Cambiando solo esta linea se usa otro adaptador concreto: el Gestor no cambia.
gps.modelo=XTR-4500L
gps.url-base=http://localhost:8080
gps.claves.xtr-4500l=sk_xtr_9F3a7C21bE6d4A10f2c8e5b7d913
gps.claves.navtrack-qx-7a=sk_nav_7b61d9e4c3a2485fae10c77d5b2f
gps.claves.geopulse-mtr-900=sk_geo_f2d84a1c9e7345b8a6d1c3f0972e
